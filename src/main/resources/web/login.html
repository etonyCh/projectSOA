<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Bibliothèque</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>📚 Bibliothèque</h1>
            <div class="form-group">
                <label for="cin">CIN Étudiant</label>
                <input type="text" id="cin" placeholder="Ex: BI220002" autofocus onkeyup="if(event.key==='Enter') login()">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" onkeyup="if(event.key==='Enter') login()">
            </div>
            <button id="btn-login" class="btn btn-primary" onclick="login()">Se connecter</button>
        </div>
    </div>
    
    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
